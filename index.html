<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wail Djabri — Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="preconnect" href="https://djabri-portfolio-default-rtdb.firebaseio.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--soft:#0a0f1c;--card:#0c1220;--line:#1c2740;--fg:#f2f5fb;--mut:#8a96b0;--blue:#2f6dff;--cyan:#00d4ff;--red:#ff3b30;--grad:linear-gradient(100deg,var(--cyan),var(--blue));--disp:'Anton',sans-serif;--body:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body[dir=rtl]{--disp:'Tajawal',sans-serif;--body:'Tajawal',sans-serif}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hide{display:none!important}

header{position:fixed;inset:0 0 auto;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;transition:background .3s}
header.sc{background:rgba(5,8,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:2px}
.logo b{font-weight:400;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:32px}
nav a{font-size:13px;font-weight:600;opacity:.85;transition:color .2s}
nav a:hover{color:var(--cyan)}
.nr{display:flex;gap:10px;align-items:center}
.rb{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.rb:hover{border-color:var(--cyan)}
#burger{display:none}

.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:120px 5vw 60px;position:relative;overflow:hidden;
background:radial-gradient(circle at 88% 10%,rgba(0,212,255,.16),transparent 40%),radial-gradient(circle at 8% 85%,rgba(47,109,255,.14),transparent 45%),var(--bg)}
.hero h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(56px,13vw,170px);line-height:.88}
.hero h1 span{display:block;animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
.hero h1 span:nth-child(2){animation-delay:.12s;-webkit-text-stroke:2px var(--fg);color:transparent}
.hero h1 span:nth-child(3){animation-delay:.24s;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{from{opacity:0;transform:translateY(36px)}}
.hs{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-top:34px;flex-wrap:wrap}
.hs p{max-width:440px;color:var(--mut);line-height:1.7}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:15px 28px;border-radius:99px;font-size:14px;font-weight:700;display:inline-block;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.b1{background:var(--grad);color:#fff}
.b2{border:1.5px solid var(--line)}

section{padding:110px 5vw}
.sec-t{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(34px,5.5vw,62px);line-height:1;margin-bottom:34px}
.sec-t i{font-style:normal;color:var(--cyan)}
.about{background:var(--soft);border-block:1px solid var(--line)}
.ag{display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:center}
.af{position:relative;aspect-ratio:4/5;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:#111827}
.af img{width:100%;height:100%;object-fit:cover}
.af span{position:absolute;bottom:16px;inset-inline-start:16px;background:var(--grad);padding:9px 15px;border-radius:4px;font-family:'Anton',sans-serif;letter-spacing:1px}
.at p{color:var(--mut);line-height:1.85;max-width:560px;margin-bottom:16px}
.stats{display:flex;gap:36px;margin-top:30px}
.stats b{display:block;font-family:var(--disp);font-weight:400;font-size:40px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats small{color:var(--mut);font-size:12px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-5px);border-color:#2a3a5c}
.cm{aspect-ratio:4/5;position:relative;background:#0a0f1c}
.cm img,.cm video{width:100%;height:100%;object-fit:cover}
.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,16,.25);opacity:0;transition:opacity .25s}
.card:hover .pl,.card:focus-visible .pl{opacity:1}
.pl i{width:54px;height:54px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center}
@media(hover:none){.pl{opacity:1;background:none;align-items:flex-end;justify-content:flex-end;padding:12px}.pl i{width:40px;height:40px}}
.ci{padding:16px}
.ci h3{font-family:var(--disp);font-weight:400;font-size:19px;text-transform:uppercase}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:4px}
.sk{aspect-ratio:4/5;border-radius:4px;background:linear-gradient(90deg,var(--card),#141d33,var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

.contact{background:var(--soft);border-top:1px solid var(--line)}
.cw{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.cb{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(30px,4.5vw,52px);line-height:1.05;margin-bottom:22px}
.cw p{color:var(--mut);line-height:1.8;max-width:420px}
.soc{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.chip{border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;transition:.2s}
.chip:hover{background:var(--grad);border-color:transparent}
.cl a{display:block;padding:18px 0;border-bottom:1px solid var(--line);transition:color .2s}
.cl a:hover{color:var(--cyan)}
.cl small{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}
footer{padding:26px 5vw;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
#gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);opacity:.5;display:flex;align-items:center;justify-content:center;transition:.2s}
#gear:hover{opacity:1;border-color:var(--cyan)}

.ov{position:fixed;inset:0;background:rgba(2,4,10,.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.md{background:var(--soft);border:1px solid var(--line);border-radius:8px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative}
.md.w{max-width:900px}.md.a{max-width:900px}
.x{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);z-index:5;font-size:16px}
.x:hover{background:var(--red)}
.lm{aspect-ratio:16/9;background:#000}
.lm video{width:100%;height:100%;background:#000;object-fit:contain}
.lb{padding:24px}.lb h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:26px;margin-bottom:8px}.lb p{color:var(--mut);line-height:1.7}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.fg input,.fg textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;color:var(--fg);font:inherit;font-size:14px;outline:0}
.fg input:focus,.fg textarea:focus{border-color:var(--blue)}
.fg textarea{min-height:80px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:12px;color:var(--mut);margin-bottom:14px}
.sub{width:100%;padding:14px;border-radius:99px;background:var(--grad);color:#fff;font-weight:700}
.sub:disabled{opacity:.5;cursor:wait}
.lock{padding:50px 28px 30px;text-align:center}
.lock h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;margin-bottom:16px}
.lock input{display:block;width:100%;max-width:280px;margin:0 auto 10px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;color:var(--fg);font:inherit;outline:0}
.err{color:var(--red);font-size:12px;margin-top:12px;min-height:14px}
.tabs{display:flex;gap:6px;padding:18px 24px 0;flex-wrap:wrap;padding-inline-end:56px}
.tab{padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut);border:1px solid var(--line)}
.tab.on{background:var(--grad);color:#fff;border-color:transparent}
.ab{padding:24px}.pane{display:none}.pane.on{display:block}
.li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.li img{width:56px;height:56px;object-fit:cover;border-radius:4px;background:#111}
.li div{flex:1;min-width:0;font-size:14px}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:14px}
.ib:hover{border-color:var(--cyan)}.ib.d:hover{border-color:var(--red);color:var(--red)}
.pp{width:170px;height:170px;border-radius:10px;overflow:hidden;margin:0 auto 20px;border:1px solid var(--line)}
.pp img{width:100%;height:100%;object-fit:cover}
.bar{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--grad)}
.vp video{width:100%;max-height:240px;background:#000;border-radius:6px;margin-bottom:14px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--grad);color:#fff;padding:13px 24px;border-radius:99px;font-weight:700;font-size:14px;z-index:2000;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
nav{display:none;position:fixed;top:76px;inset-inline:5vw;flex-direction:column;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:20px;gap:18px}
nav.open{display:flex}
#burger{display:flex;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);align-items:center;justify-content:center}
.ag,.cw{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.fr{grid-template-columns:1fr}
}
@media(max-width:560px){.grid{grid-template-columns:1fr}section{padding:80px 6vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body dir="ltr">

<header id="hd">
  <div class="logo">DJABRI<b>.20</b></div>
  <nav id="nav">
    <a href="#home" data-t="nav_home"></a><a href="#about" data-t="nav_about"></a><a href="#work" data-t="nav_work"></a><a href="#contact" data-t="nav_contact"></a>
  </nav>
  <div class="nr">
    <button class="rb" id="langBtn" aria-label="Language">AR</button>
    <button id="burger" aria-label="Menu">☰</button>
  </div>
</header>

<section class="hero" id="home">
  <h1><span data-t="h1"></span><span data-t="h2"></span><span data-t="h3"></span></h1>

    <p data-t="hdesc"></p>
    <div class="cta"><a href="#work" class="btn b1" data-t="hb1"></a><a href="#contact" class="btn b2" data-t="hb2"></a></div>
  </div>
</section>

<section class="about" id="about">
  <div class="ag">
    <div class="af"><img id="aboutImg" alt="Wail Djabri" width="800" height="1000" src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=70&w=600&auto=format&fit=crop"><span>20 <small data-t="yo"></small></span></div>
    <div class="at">
      <h2 class="sec-t"><span data-t="at1"></span> <i data-t="at2"></i></h2>

</section>

<section id="work">

</section>

<section class="contact" id="contact">
  <div class="cw">
    <div>
      <h2 class="cb"><span data-t="ct1"></span> <i style="font-style:normal;color:var(--cyan)" data-t="ct2"></i></h2>
      <p data-t="ctp"></p>
      <div class="soc" id="soc"></div>
    </div>
    <div class="cl" id="cl"></div>
  </div>
</section>

<footer>
  <div data-t="foot"></div>
  <button id="gear" aria-label="Admin">⚙</button>
</footer>

<!-- lightbox -->
<div class="ov" id="ovItem"><div class="md w">
  <button class="x" data-x="ovItem" aria-label="Close">✕</button>
  <div class="lm" id="lm"></div>
  <div class="lb"><h2 id="lbT"></h2><p id="lbD"></p></div>
</div></div>

<!-- login -->
<div class="ov" id="ovLogin"><div class="md">
  <button class="x" data-x="ovLogin" aria-label="Close">✕</button>
  <div class="lock">
    <h2 data-t="adm"></h2>
    <input type="email" id="em" placeholder="Email" autocomplete="username">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button class="btn b1" id="loginBtn" data-t="enter"></button>
    <div class="err" id="err"></div>
  </div>
</div></div>

<!-- dashboard -->
<div class="ov" id="ovAdmin"><div class="md a">
  <button class="x" data-x="ovAdmin" aria-label="Close">✕</button>
  <div class="tabs">
    <button class="tab on" data-tab="add" data-t="tab_add"></button>
    <button class="tab" data-tab="manage" data-t="tab_manage"></button>
    <button class="tab" data-tab="photo" data-t="tab_photo"></button>
    <button class="tab" data-tab="set" data-t="tab_set"></button>
    <button class="tab" data-tab="out" data-t="logout"></button>
  </div>
  <div class="ab">
    <div class="pane on" id="p-add">
      <form id="fItem">
        <div class="fr">
          <div class="fg"><label data-t="f_te"></label><input id="tEn" required></div>
          <div class="fg"><label data-t="f_ta"></label><input id="tAr" dir="rtl" required></div>
        </div>
        <div class="fr">
          <div class="fg"><label data-t="f_de"></label><textarea id="dEn"></textarea></div>
          <div class="fg"><label data-t="f_da"></label><textarea id="dAr" dir="rtl"></textarea></div>
        </div>
        <div class="fg"><label data-t="f_vid"></label><input type="file" id="vFile" accept="video/*"></div>
        <div class="vp hide" id="vpW"><video id="vp" controls playsinline></video></div>
        <div class="hide" id="upW"><div class="bar"><i id="barF"></i></div><div class="note" id="barL"></div></div>
        <div class="note" id="vNote" data-t="f_note"></div>
        <input type="hidden" id="editId">
        <button class="sub" id="subBtn" data-t="save"></button>
      </form>
    </div>
    <div class="pane" id="p-manage"><div id="mList"></div></div>
    <div class="pane" id="p-photo">
      <div class="pp"><img id="ppImg" alt=""></div>

        <div class="fg"><label data-t="f_photo"></label><input type="file" id="phFile" accept="image/*"></div>
        <button class="sub" id="phBtn" data-t="save_photo"></button>
      </form>
    </div>
    <div class="pane" id="p-set">
      <form id="fSet">
        <div class="fr">
          <div class="fg"><label data-t="l_phone"></label><input id="sPhone"></div>
          <div class="fg"><label data-t="l_wa"></label><input id="sWa"></div>
        </div>
        <div class="fg"><label data-t="l_mail"></label><input type="email" id="sMail"></div>
        <div class="fr">
          <div class="fg"><label>Instagram</label><input id="sIg"></div>
          <div class="fg"><label>TikTok</label><input id="sTt"></div>
        </div>
        <div class="fg"><label>Snapchat</label><input id="sSc"></div>
        <button class="sub" data-t="save_set"></button>
      </form>
    </div>
  </div>
</div></div>

<div class="toast" id="toast" role="status"></div>

  ok_photo:['Photo saved','تم حفظ الصورة'],ok_set:['Settings saved','تم حفظ الإعدادات'],
  del_q:['Delete "{t}"? This cannot be undone.','حذف "{t}"؟ لا يمكن التراجع.'],
  bad_login:['Wrong email or password.','الإيميل أو كلمة السر غير صحيحة.'],
  denied:['Save failed. Sign in again and check the database rules.','فشل الحفظ. سجّل الدخول من جديد وتحقق من قواعد القاعدة.'],
  load_fail:['Could not load videos. Check your connection.','تعذر تحميل الفيديوهات. تحقق من الاتصال.'],
  has_vid:['A video is already saved. Pick a file only to replace it.','يوجد فيديو محفوظ. اختر ملفاً فقط لاستبداله.']
};
let lang = localStorage.getItem('lang') === 'ar' ? 'ar' : 'en';
const L = k => T[k][lang === 'ar' ? 1 : 0];
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L(el.dataset.t));
  document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang === 'ar' ? 'EN' : 'AR';
  renderGallery(); renderContact();
  if ($('ovAdmin').classList.contains('open')) renderManage();
}
$('langBtn').onclick = () => { lang = lang === 'en' ? 'ar' : 'en'; localStorage.setItem('lang', lang); applyLang(); };

/* ===== state + public read (REST: no Firebase SDK needed for visitors) ===== */
let items = [], loaded = false;
let settings = {photo:'',phone:'',whatsapp:'',email:'',instagram:'',tiktok:'',snapchat:''};

async function readKey(key){
  const r = await fetch(`${DB}/${key}.json`);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const normItems = v => (Array.isArray(v) ? v : Object.values(v || {})).filter(Boolean);

async function init(){
  try{
    const c = JSON.parse(localStorage.getItem('dj-cache') || 'null');
    if (c){ items = c.items || []; settings = {...settings, ...c.settings}; loaded = true; }
  }catch(e){}
  applyAbout(); applyLang();
  try{
    const [it, st] = await Promise.all([readKey('djabri-items'), readKey('djabri-settings')]);
    items = normItems(it);
    if (st){ delete st.adminPassword; settings = {...settings, ...st}; }
    loaded = true;
    try{ localStorage.setItem('dj-cache', JSON.stringify({items: items.map(({thumb, ...r}) => r), settings: {...settings, photo: settings.photo.startsWith('data:') ? '' : settings.photo}})); }catch(e){}
  }catch(e){
    console.error('read failed', e);
    if (!items.length){ loaded = true; $('grid').innerHTML = `<div class="empty">${esc(L('load_fail'))}</div>`; $('cnt').textContent = 0; renderContact(); return; }
  }
  applyAbout(); applyLang();
}

function applyAbout(){ if (settings.photo) $('aboutImg').src = settings.photo; }

/* ===== Cloudinary ===== */
function upload(file, type, onProg){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD}/${type}/upload`);
    x.upload.onprogress = e => { if (e.lengthComputable && onProg) onProg(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300){
        try{ const d = JSON.parse(x.responseText); res({url: d.secure_url, id: d.public_id}); }catch(e){ rej(e); }
      } else rej(new Error('HTTP ' + x.status + ' ' + x.responseText));
    };
    x.onerror = () => rej(new Error('network'));
    const f = new FormData(); f.append('file', file); f.append('upload_preset', PRESET);
    x.send(f);
  });
}
const thumbOf = it => it.media && it.media.includes('/video/upload/')
  ? it.media.replace('/video/upload/', '/video/upload/so_1,w_480,h_600,c_fill,q_auto,f_jpg/').replace(/\.\w+(\?.*)?$/, '.jpg')
  : (it.thumb || '');
const videoSrc = u => u.replace('/video/upload/', '/video/upload/q_auto,f_mp4,w_1080,c_limit/');

/* ===== gallery ===== */
function renderGallery(){
  $('cnt').textContent = items.length;
  const g = $('grid');
  if (!loaded) return;
  if (!items.length){ g.innerHTML = `<div class="empty">${esc(L('no_items'))}</div>`; return; }
  g.innerHTML = '';
  items.slice().reverse().forEach(it => {
    const c = document.createElement('div');
    c.className = 'card'; c.tabIndex = 0; c.setAttribute('role', 'button');
    c.innerHTML = `<div class="cm"><img src="${esc(thumbOf(it))}" alt="" loading="lazy" decoding="async">
      <div class="pl"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></i></div></div>
      <div class="ci"><h3>${esc(lang === 'ar' ? it.titleAr : it.titleEn)}</h3></div>`;
    c.querySelector('img').addEventListener('error', function(){
      const v = document.createElement('video');
      v.src = safeUrl(it.media) + '#t=0.5'; v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      this.replaceWith(v);
    }, {once: true});
    const open = () => openLightbox(it);
    c.onclick = open; c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
    g.appendChild(c);
  });
}

function openLightbox(it){
  const lm = $('lm'); lm.innerHTML = '';
  const orig = safeUrl(it.media);
  const v = document.createElement('video');
  v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = 'metadata';
  v.src = videoSrc(orig);
  v.onerror = () => { if (v.dataset.fb) return; v.dataset.fb = 1; v.src = orig; v.play().catch(() => {}); };
  lm.appendChild(v);
  $('lbT').textContent = lang === 'ar' ? it.titleAr : it.titleEn;
  $('lbD').textContent = (lang === 'ar' ? it.descAr : it.descEn) || '';
  openOv('ovItem');
}

/* ===== contact ===== */
const social = (v, base) => safeUrl(v) || (v ? base + String(v).replace(/^@/, '') : '');
function renderContact(){
  const s = settings, wa = String(s.whatsapp || '').replace(/\D/g, '');
  const rows = [];
  if (s.phone) rows.push(`<a href="tel:${esc(s.phone)}"><small>${esc(L('call'))}</small>${esc(s.phone)}</a>`);
  if (wa) rows.push(`<a href="https://wa.me/${wa}" target="_blank" rel="noopener"><small>${esc(L('l_wa'))}</small>${esc(s.whatsapp)}</a>`);
  if (s.email) rows.push(`<a href="mailto:${esc(s.email)}"><small>${esc(L('l_mail'))}</small>${esc(s.email)}</a>`);
  $('cl').innerHTML = rows.join('');
  $('soc').innerHTML = [['Instagram', social(s.instagram, 'https://instagram.com/')], ['TikTok', social(s.tiktok, 'https://tiktok.com/@')], ['Snapchat', social(s.snapchat, 'https://snapchat.com/add/')]]
    .filter(x => x[1]).map(x => `<a class="chip" href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join('');
}

/* ===== overlays / ui ===== */
const openOv = id => $(id).classList.add('open');
function closeOv(id){ $(id).classList.remove('open'); if (id === 'ovItem') $('lm').innerHTML = ''; }
document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeOv(b.dataset.x));
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeOv(o.id); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.ov.open').forEach(o => closeOv(o.id)); });
let tt;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3200); }
addEventListener('scroll', () => $('hd').classList.toggle('sc', scrollY > 30), {passive: true});
$('burger').onclick = () => $('nav').classList.toggle('open');
$('nav').onclick = e => { if (e.target.tagName === 'A') $('nav').classList.remove('open'); };

/* ===== admin: Firebase Auth loaded only when needed; writes go through REST ===== */
let fbReady = null;
function loadScript(src){ return new Promise((r, j) => { const s = document.createElement('script'); s.src = src; s.onload = r; s.onerror = j; document.head.appendChild(s); }); }
function loadFirebase(){
  if (!fbReady) fbReady = (async () => {
    const b = 'https://www.gstatic.com/firebasejs/10.12.5/';
    await loadScript(b + 'firebase-app-compat.js');
    await loadScript(b + 'firebase-auth-compat.js');
    if (!firebase.apps.length) firebase.initializeApp(FB);
  })().catch(e => { fbReady = null; throw e; });
  return fbReady;
}
async function writeKey(key, value){
  try{
    await loadFirebase();
    const user = firebase.auth().currentUser;
    if (!user) throw new Error('no user');
    const token = await user.getIdToken();
    const r = await fetch(`${DB}/${key}.json?auth=${token}`, {method: 'PUT', body: JSON.stringify(value)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    try{ localStorage.removeItem('dj-cache'); }catch(e){}
    return true;
  }catch(e){ console.error('write failed', e); toast(L('denied')); return false; }
}

$('gear').onclick = async () => {
  try{ await loadFirebase(); }catch(e){ toast(L('up_fail')); return; }
  const wait = new Promise(r => { const u = firebase.auth().onAuthStateChanged(x => { u(); r(x); }); });
  if (await wait) openAdmin();
  else { $('pw').value = ''; $('err').textContent = ''; openOv('ovLogin'); }
};
async function login(){
  const b = $('loginBtn'); b.disabled = true;
  try{
    await loadFirebase();
    await firebase.auth().signInWithEmailAndPassword($('em').value.trim(), $('pw').value);
    $('pw').value = ''; closeOv('ovLogin'); openAdmin();
  }catch(e){ $('err').textContent = L('bad_login'); }
  b.disabled = false;
}
$('loginBtn').onclick = login;
$('pw').onkeydown = e => { if (e.key === 'Enter') login(); };

function openAdmin(){ resetForm(); renderManage(); fillSet(); $('ppImg').src = settings.photo || $('aboutImg').src; openOv('ovAdmin'); }
document.querySelectorAll('.tab').forEach(t => t.onclick = async () => {
  if (t.dataset.tab === 'out'){ await firebase.auth().signOut(); closeOv('ovAdmin'); return; }
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t.dataset.tab));
});

/* add / edit video */
let pending = null;
function resetForm(){
  $('fItem').reset(); $('editId').value = ''; pending = null;
  $('subBtn').disabled = false;
  $('vpW').classList.add('hide'); $('upW').classList.add('hide');
  $('vNote').textContent = L('f_note');
}
$('vFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > MAX_MB * 1048576){
    toast(L('too_big').replace('{s}', (f.size / 1048576).toFixed(1)).replace('{m}', MAX_MB));
    e.target.value = ''; return;
  }
  pending = f; $('vp').src = URL.createObjectURL(f); $('vpW').classList.remove('hide');
};
$('fItem').onsubmit = async e => {
  e.preventDefault();
  const editId = $('editId').value, old = editId ? items.find(x => x.id === editId) : null;
  if (!pending && !(old && old.media)) return toast(L('need_vid'));
  const btn = $('subBtn'); btn.disabled = true;
  let media = old ? old.media : '', publicId = old ? old.publicId : '';
  if (pending){
    $('upW').classList.remove('hide');
    try{
      const r = await upload(pending, 'video', p => { $('barF').style.width = p + '%'; $('barL').textContent = L('uploading').replace('{p}', p); });
      media = r.url; publicId = r.id;
    }catch(err){ console.error(err); toast(L('up_fail')); btn.disabled = false; $('upW').classList.add('hide'); return; }
  }
  const d = {id: editId || 'it_' + Date.now(), titleEn: $('tEn').value, titleAr: $('tAr').value, descEn: $('dEn').value, descAr: $('dAr').value, media, publicId};
  const next = items.slice();
  if (editId){ const i = next.findIndex(x => x.id === editId); if (i > -1) next[i] = d; } else next.push(d);
  if (!await writeKey('djabri-items', next)){ btn.disabled = false; return; }
  items = next; resetForm(); toast(L('ok_vid')); renderGallery(); renderManage();
};

function renderManage(){
  const m = $('mList');
  if (!items.length){ m.innerHTML = `<div class="empty">${esc(L('no_items'))}</div>`; return; }
  m.innerHTML = '';
  items.slice().reverse().forEach(it => {
    const r = document.createElement('div'); r.className = 'li';
    r.innerHTML = `<img src="${esc(thumbOf(it))}" alt="" loading="lazy"><div>${esc(it.titleEn)} / ${esc(it.titleAr)}</div>
      <button class="ib" aria-label="Edit">✎</button><button class="ib d" aria-label="Delete">🗑</button>`;
    const [ed, del] = r.querySelectorAll('button');
    ed.onclick = () => editItem(it); del.onclick = () => delItem(it);
    m.appendChild(r);
  });
}
function editItem(it){
  $('tEn').value = it.titleEn || ''; $('tAr').value = it.titleAr || ''; $('dEn').value = it.descEn || ''; $('dAr').value = it.descAr || '';
  $('vFile').value = ''; pending = null; $('editId').value = it.id;
  $('vp').src = it.media; $('vpW').classList.remove('hide'); $('vNote').textContent = L('has_vid');
  document.querySelector('.tab[data-tab="add"]').click();
}
async function delItem(it){
  if (!confirm(L('del_q').replace('{t}', lang === 'ar' ? it.titleAr : it.titleEn))) return;
  const next = items.filter(x => x.id !== it.id);
  if (!await writeKey('djabri-items', next)) return;
  items = next; toast(L('ok_del')); renderGallery(); renderManage();
  if (it.publicId){ // optional serverless cleanup; ignore failure
    try{
      const tk = await firebase.auth().currentUser.getIdToken();
      fetch('/api/delete-cloudinary', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + tk}, body: JSON.stringify({public_id: it.publicId})});
    }catch(e){}
  }
}

/* profile photo -> Cloudinary (never base64 in the database) */
let phFile = null;
$('phFile').onchange = e => { phFile = e.target.files[0] || null; if (phFile) $('ppImg').src = URL.createObjectURL(phFile); };
$('fPhoto').onsubmit = async e => {
  e.preventDefault(); if (!phFile) return;
  const b = $('phBtn'); b.disabled = true;
  try{
    const r = await upload(phFile, 'image');
    const next = {...settings, photo: r.url.replace('/image/upload/', '/image/upload/w_700,q_auto,f_auto/')};
    if (await writeKey('djabri-settings', next)){ settings = next; applyAbout(); phFile = null; toast(L('ok_photo')); }
  }catch(err){ console.error(err); toast(L('up_fail')); }
  b.disabled = false;
};

/* contact settings */
function fillSet(){
  $('sPhone').value = settings.phone || ''; $('sWa').value = settings.whatsapp || ''; $('sMail').value = settings.email || '';
  $('sIg').value = settings.instagram || ''; $('sTt').value = settings.tiktok || ''; $('sSc').value = settings.snapchat || '';
}
$('fSet').onsubmit = async e => {
  e.preventDefault();
  const next = {...settings, phone: $('sPhone').value, whatsapp: $('sWa').value, email: $('sMail').value, instagram: $('sIg').value, tiktok: $('sTt').value, snapchat: $('sSc').value};
  if (!await writeKey('djabri-settings', next)) return;
  settings = next; renderContact(); toast(L('ok_set'));
};

init();
</script>
